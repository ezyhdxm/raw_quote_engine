[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raw-quote-engine"
version = "0.3.1"
description = "Known-time quote diagnostics, causal features and paired model research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.2", "matplotlib>=3.7", "lightgbm>=4.0", "pyarrow>=12", "ipywidgets>=8", "ipython>=8"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbformat>=5.9", "nbclient>=0.10"]

[project.scripts]
raw-quote-engine = "raw_quote_engine.cli:main"

[tool.setuptools.packages.find]
include = ["raw_quote_engine*", "bond_pricer*"]
